<style>
:root{--bg:#EDEDED;--ink:#111;--mute:#6B6B6B;--line:#D2D2D2}
*{box-sizing:border-box;margin:0}
body{font-family:Figtree,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;display:grid;place-items:center;padding:24px}
main{width:100%;max-width:480px;background:#fff;border-radius:20px;padding:36px 28px;box-shadow:0 10px 40px rgba(0,0,0,.06)}
.logo{display:block;margin:0 0 18px;height:auto}
.k{font-size:13px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}
h1{font-size:34px;line-height:1.05;letter-spacing:-.03em;font-weight:800;margin:10px 0 8px}
p.s{color:var(--mute);margin-bottom:24px;line-height:1.5}
label{display:block;font-weight:600;font-size:14px;margin:14px 0 6px}
input,select{width:100%;font:inherit;padding:13px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)}
input:focus,select:focus{outline:2px solid var(--ink);outline-offset:1px}
button{margin-top:22px;width:100%;font:inherit;font-weight:800;padding:15px;border:0;border-radius:12px;background:var(--ink);color:#fff;cursor:pointer}
button:disabled{opacity:.5;cursor:wait}
.hp{position:absolute;left:-9999px}
#msg{margin-top:16px;font-weight:600;min-height:22px}
.ok{color:#111}.err{color:#8a1c1c}
small{display:block;margin-top:14px;color:var(--mute);line-height:1.4}
</style><script src="/assets/clarity.js" async></script>
